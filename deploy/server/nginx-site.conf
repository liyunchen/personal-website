server {
    listen 80;
    server_name example.com;
    
    # ACME 证书签发/续期验证目录（certbot webroot 模式，必须放在跳转之前）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    
    # 其余请求跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    access_log /www/wwwlogs/example.com.log;
    error_log  /www/wwwlogs/example.com.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;
    
    # ── SSL 证书（certbot webroot 签发，自动续期）──
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    
    charset utf-8;
    client_max_body_size 12m;
    
    # ── 后端 API 反代（127.0.0.1:8101，独立端口，不与 qauto 的 8100 冲突）──
    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
    
    # ── 上传的图片文件 ──
    location /uploads/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # ── 带哈希的静态资源：长期缓存 ──
    location /assets/ {
        alias /www/wwwroot/your-project/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ── 首页HTML：不缓存，保证更新后立即生效 ──
    location = /index.html {
        root /www/wwwroot/your-project/dist;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # ── SPA 回退 ──
    location / {
        root /www/wwwroot/your-project/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    
    access_log /www/wwwlogs/example.com.log;
    error_log  /www/wwwlogs/example.com.error.log;
}